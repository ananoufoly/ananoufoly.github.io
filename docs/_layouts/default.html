<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}Foly Ananou</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="alternate" type="application/rss+xml" title="Foly Ananou — new work" href="/feed.xml">
</head>
<body>
<div class="site-container">
  {% include nav.html %}
  <main>
{{ content }}
  </main>
  <footer class="site-footer">
    <p class="disclaimer">{{ site.data.profile.disclaimer_en }}<br><span lang="fr">{{ site.data.profile.disclaimer_fr }}</span></p>
    <a href="/">Foly Ananou</a> &middot; {{ site.time | date: "%Y" }} &middot; <a href="/feed.xml">RSS</a> &middot; <a href="/items.json">JSON</a>
  </footer>
</div>
</body>
</html>
