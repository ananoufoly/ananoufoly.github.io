<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Page autonome à accès restreint : contenu chiffré, non indexé. -->
<meta name="robots" content="noindex, nofollow">
<title>Document de travail — accès restreint</title>
<style>
:root{--bg:#fff;--ink:#1a1a1a;--muted:#777;--line:#d5d5d0;--accent:#1d39c4;--neg:#9b2c2c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--ink:#ecebe7;--muted:#94938e;--line:#3d3d3a;--accent:#8fa3ff;--neg:#f0a0a0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
form{width:100%;max-width:340px}
h1{font-size:17px;font-weight:650;margin:0 0 4px}
p{color:var(--muted);font-size:13px;margin:0 0 16px}
label{display:block;font-size:13px;margin-bottom:6px}
input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{margin-top:12px;font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border:1px solid var(--ink);
  border-radius:4px;background:var(--ink);color:var(--bg);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.5em;margin-top:10px;font-size:13px;color:var(--neg)}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <h1>Document de travail</h1>
  <p>Accès restreint. Saisir le mot de passe communiqué.</p>
  <label for="pw">Mot de passe</label>
  <input type="password" id="pw" autocomplete="current-password" required>
  <button type="submit" id="go">Ouvrir</button>
  <div class="msg" id="msg" role="status"></div>
</form>
<script>
(function(){
"use strict";
// Doit correspondre à PBKDF2_ITERS dans encrypt_diaspora.py
var PBKDF2_ITERS = 250000;

function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

async function decrypt(blob, password){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(blob.salt), iterations:PBKDF2_ITERS, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
  return new TextDecoder().decode(pt);
}
window.__decryptDiaspora = decrypt; // utilisé par les tests locaux

var form = document.getElementById("gate");
if (!form) return;
var msg = document.getElementById("msg"), btn = document.getElementById("go");
if (!window.crypto || !crypto.subtle){ msg.textContent = "Ce navigateur ne permet pas le déchiffrement (connexion HTTPS requise)."; btn.disabled = true; return; }

form.addEventListener("submit", async function(e){
  e.preventDefault();
  msg.textContent = ""; btn.disabled = true; btn.textContent = "Ouverture…";
  try {
    var res = await fetch("diaspora.enc", {cache:"no-store"});
    if (!res.ok) throw new Error("fetch");
    var blob = await res.json();
    var html;
    try { html = await decrypt(blob, document.getElementById("pw").value); }
    catch (err){ msg.textContent = "Mot de passe incorrect."; btn.disabled = false; btn.textContent = "Ouvrir"; return; }
    document.open(); document.write(html); document.close();
  } catch (err){
    msg.textContent = "Le document n'a pas pu être chargé.";
    btn.disabled = false; btn.textContent = "Ouvrir";
  }
});
})();
</script>
</body>
</html>
